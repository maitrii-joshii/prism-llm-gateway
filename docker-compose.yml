services:

  prism-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: prism-gateway
    ports:
      - "3000:3000"
    volumes:
      - prism-db:/app/dbdata
    environment:
      PORT: "3000"
      PRISM_CONFIG_DIR: /app/config
      PRISM_DB_PATH: /app/dbdata/prism.db
      PRISM_LOG_LEVEL: INFO
      PRISM_ADMIN_TOKEN: ${PRISM_ADMIN_TOKEN:-admin-secret-change-me}
      PRISM_PROVIDER_OPENAI_API_KEY: enter-your-key-here
      PRISM_PROVIDER_OPENAI_BASE_URL: https://openrouter.ai/api/v1
      PRISM_PROVIDER_QWEN_API_KEY: enter-your-key-here
      PRISM_PROVIDER_QWEN_BASE_URL: https://api.groq.com/openai/v1

    networks:
      - prism-network
    restart: unless-stopped

volumes:
  prism-db:
    driver: local

networks:
  prism-network:
    driver: bridge
